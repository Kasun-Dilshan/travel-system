<!doctype html>
<html lang="en">
  <head>
    <base href="%BASE_URL%" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Primary Meta Tags -->
    <title>Serendib Travel & Tours | Luxury Sri Lankan Adventures</title>
    <meta name="title" content="Serendib Travel & Tours | Luxury Sri Lankan Adventures" />
    <meta name="description" content="Discover the beauty of Sri Lanka with Serendib Travel & Tours. Luxury adventures, inbound tours, and global wonders curated for the soul." />
    <meta name="keywords" content="Sri Lanka travel, luxury tours, inbound travel, outbound travel, Serendib tours, Sri Lanka adventure" />
    <meta name="author" content="Serendib Travel & Tours" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://serendibdestinations.com/" />
    <meta property="og:title" content="Serendib Travel & Tours | Luxury Sri Lankan Adventures" />
    <meta property="og:description" content="Discover the beauty of Sri Lanka with Serendib Travel & Tours. Luxury adventures, inbound tours, and global wonders curated for the soul." />
    <meta property="og:image" content="/og-image.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://serendibdestinations.com/" />
    <meta property="twitter:title" content="Serendib Travel & Tours | Luxury Sri Lankan Adventures" />
    <meta property="twitter:description" content="Discover the beauty of Sri Lanka with Serendib Travel & Tours. Luxury adventures, inbound tours, and global wonders curated for the soul." />
    <meta property="twitter:image" content="/og-image.webp" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- Critical theme + layout (works even if /assets/*.css fails to load on the host) -->
    <style id="critical-theme">
      :root {
        --primary: 142 76% 36%;
        --primary-foreground: 0 0% 100%;
        --secondary: 142 76% 15%;
        --secondary-foreground: 0 0% 98%;
        --accent: 142 70% 45%;
        --accent-foreground: 0 0% 100%;
        --background: 142 40% 97%;
        --foreground: 240 10% 4%;
        --card: 142 30% 100%;
        --card-foreground: 222 47% 11%;
        --glass: 142 40% 100% / 0.8;
        --glass-border: 142 76% 36% / 0.1;
        --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Outfit, Inter, system-ui, -apple-system, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        width: 100%;
        min-height: 100dvh;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: Outfit, sans-serif;
        color: hsl(var(--secondary));
        line-height: 1.1;
      }
      .serif { font-family: "Playfair Display", Georgia, serif; }
      .site-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        isolation: isolate;
      }
      .site-main {
        flex: 1 0 auto;
        position: relative;
        z-index: 1;
        width: 100%;
      }
      .site-footer {
        flex-shrink: 0;
        position: relative;
        z-index: 2;
        background-color: hsl(142, 76%, 15%);
        color: #fff;
      }
      .grid-layout {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
        gap: clamp(1.25rem, 4vw, 2.5rem);
      }
      .glass-nav {
        background: hsla(142, 40%, 98%, 0.7);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid hsla(142, 76%, 36%, 0.08);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        text-decoration: none;
        gap: 0.5rem;
      }
      .btn-primary {
        background-color: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
      }
      @media (max-width: 480px) {
        .grid-layout { grid-template-columns: 1fr; }
      }
    </style>
    <style>
      #boot-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: system-ui, sans-serif;
        color: #14532d;
        background: #f0fdf4;
        padding: 2rem;
        text-align: center;
      }
      #boot-fallback .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #14532d;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid hsl(var(--primary));
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }
    </style>
    <script>
      window.__showBootError = function (message) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div id="boot-fallback"><strong>Site failed to load</strong><p>' +
          message +
          '</p><p style="font-size:0.9rem;color:#666">Upload the full dist/backend folder to public_html (including the assets folder and .htaccess).</p></div>';
      };
      window.addEventListener('error', function (event) {
        if (!event.filename) return;
        if (/\/assets\/.+\.js$/i.test(event.filename)) {
          window.__showBootError('JavaScript file missing: ' + event.filename);
        }
        if (/\/assets\/.+\.css$/i.test(event.filename)) {
          document.documentElement.classList.add('css-bundle-missing');
          console.warn('Stylesheet failed to load:', event.filename);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="loader"></div>
        <p>Loading Serendib Travel…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
